<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
  <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>

  <defs>
    <linearGradient id="barGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="698" height="328" rx="16" fill="#0d1117" stroke="#2c5364" stroke-width="1"/>

  <text x="30" y="38" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="700" fill="#00C6FF">
    Nivel de especializacion
  </text>

  <!-- Row 1: Cloud (AWS / Azure / GCP) - 92% -->
  <text x="30" y="82" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#c9d1d9">Cloud (AWS · Azure · GCP)</text>
  <text x="640" y="82" text-anchor="end" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#00C6FF">92%</text>
  <rect x="30" y="90" width="610" height="12" rx="6" fill="#161b22" stroke="#2c5364" stroke-width="1"/>
  <rect x="30" y="90" width="0" height="12" rx="6" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="561" dur="1.8s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
  </rect>

  <!-- Row 2: CI/CD & GitOps - 90% -->
  <text x="30" y="134" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#c9d1d9">CI/CD &amp; GitOps</text>
  <text x="640" y="134" text-anchor="end" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#00C6FF">90%</text>
  <rect x="30" y="142" width="610" height="12" rx="6" fill="#161b22" stroke="#2c5364" stroke-width="1"/>
  <rect x="30" y="142" width="0" height="12" rx="6" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="549" dur="1.8s" begin="1.05s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
  </rect>

  <!-- Row 3: Kubernetes & Orchestration - 88% -->
  <text x="30" y="186" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#c9d1d9">Kubernetes &amp; Orchestration</text>
  <text x="640" y="186" text-anchor="end" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#00C6FF">88%</text>
  <rect x="30" y="194" width="610" height="12" rx="6" fill="#161b22" stroke="#2c5364" stroke-width="1"/>
  <rect x="30" y="194" width="0" height="12" rx="6" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="537" dur="1.8s" begin="2.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
  </rect>

  <!-- Row 4: Infrastructure as Code - 85% -->
  <text x="30" y="238" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#c9d1d9">Infrastructure as Code</text>
  <text x="640" y="238" text-anchor="end" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#00C6FF">85%</text>
  <rect x="30" y="246" width="610" height="12" rx="6" fill="#161b22" stroke="#2c5364" stroke-width="1"/>
  <rect x="30" y="246" width="0" height="12" rx="6" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="518" dur="1.8s" begin="3.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
  </rect>

  <!-- Row 5: Observability & Monitoring - 80% -->
  <text x="30" y="290" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#c9d1d9">Observability &amp; Monitoring</text>
  <text x="640" y="290" text-anchor="end" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#00C6FF">80%</text>
  <rect x="30" y="298" width="610" height="12" rx="6" fill="#161b22" stroke="#2c5364" stroke-width="1"/>
  <rect x="30" y="298" width="0" height="12" rx="6" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="488" dur="1.8s" begin="4.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
  </rect>
</svg>
